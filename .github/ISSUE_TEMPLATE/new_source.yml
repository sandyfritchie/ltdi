name: New source or service
description: Propose a product, open model, dataset or benchmark for the Index to track
title: "New source: [name]"
labels: [new source]
body:
  - type: input
    id: name
    attributes:
      label: Name
      description: The product, model, dataset or benchmark, and who makes it
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What it is
      options:
        - Commercial service
        - Regional provider
        - Open model or tool
        - Dataset
        - Benchmark results
        - Other
    validations:
      required: true
  - type: input
    id: list
    attributes:
      label: Official language list
      description: A link to the maker's own list of supported languages (or per-language results). The Index only reads official, citable lists.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: How many languages it covers, licence, how the list is kept up to date
