name: Correction
description: A value for a language is wrong or out of date
title: "Correction: [language] [what's wrong]"
labels: [correction]
body:
  - type: input
    id: language
    attributes:
      label: Language
      description: Its name and code as shown on its page (for example "Yoruba [yo]")
    validations:
      required: true
  - type: input
    id: value
    attributes:
      label: What's wrong
      description: The service, dataset or field, what the Index shows, and what it should show
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: A link to the official page or data that documents the correct value
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Dates, regional differences, or context that would help
