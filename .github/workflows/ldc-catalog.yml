# Reads the LDC catalog's speech corpora (tools/ldc_speech.py crawl); the rows are LDCROW lines in the log,
# turned into config/ldc_speech.csv with tools/ldc_speech.py ingest. Run by hand a few times a year.
name: LDC catalog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/ldc_speech.py crawl
