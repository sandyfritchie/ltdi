# Checks every push and pull request: the tests pass, and the committed site/ is what scoring and the
# site build make from the committed data/ and config/. If the last step fails, someone changed data,
# config or code without rebuilding: run
#   python -m ltdi.score && python -m ltdi.build_site
# and commit what changes under site/. (The build reads LinguaMeta's locale table over the network, so
# a change upstream can also show up here.)
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the test runner (the pipeline itself needs only the standard library)
        run: pip install pytest
      - name: Tests
        run: python -m pytest tests -q
      - name: Score
        run: python -m ltdi.score > /dev/null
      - name: Build the site
        run: python -m ltdi.build_site
      - name: The committed site matches the build
        run: |
          changed=$(git status --porcelain -- site/)
          if [ -n "$changed" ]; then
            echo "::error::site/ doesn't match a fresh build from data/ and config/. Run python -m ltdi.score && python -m ltdi.build_site and commit site/."
            echo "$changed" | head -40
            git diff --stat -- site/ | tail -5
            exit 1
          fi
          echo "site/ matches the build"
