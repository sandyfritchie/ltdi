# Estimates HPLT 3.0's words per language from its manifest and its documents, checked by language ID (tools/hplt_words.py).
# The results are in the job log (lines starting HPLT); ingest them with tools/hplt_words.py --ingest.
name: HPLT words

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install zstandard "numpy<2" fasttext-wheel huggingface_hub
      - name: Count
        run: python tools/hplt_words.py
