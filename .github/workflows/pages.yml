# Publishes the built site (site/) to GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Publish site

on:
  push:
    branches: [main]
    paths: ["site/**", "data/**", "config/**", "ltdi/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The JSON API (site/api/v1: one file per language) comes entirely from the committed data and
      # config, so it's generated here rather than committed (ltdi/api.py). Rank ranges come from the committed data/sensitivity.csv
      - name: Score
        run: python -m ltdi.score > /dev/null
      - name: Write the JSON API
        run: python -m ltdi.api
      - name: Leave out the build template
        run: rm -f site/template.html site/artifact.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
