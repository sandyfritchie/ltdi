# The slow collectors (Hugging Face datasets and models, Wikipedia articles, editors and page views:
# thousands of requests each), run on the 3rd of each month or by hand (Actions -> Monthly collectors
# -> Run workflow). If a list lost many languages, the collector stops and nothing is committed.
# After committing the new records and the rebuilt site, it starts "Publish site", since a push made
# by a workflow doesn't start other workflows. Last, it opens an issue listing any hand-copied language
# list more than three months old (tools/stale_lists.py).
name: Monthly collectors

on:
  schedule:
    - cron: "41 7 3 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: monthly-collectors
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the test runner
        run: pip install pytest
      - name: Collect
        run: python -m ltdi.collectors --monthly
      - name: Speech locales listed without naming their variety (for varieties' pages)
        run: python tools/unnamed_locales.py
      - name: Score and build
        run: |
          python -m ltdi.score > /dev/null
          python -m ltdi.sensitivity > /dev/null
          python tools/validate.py > /dev/null
          python -m ltdi.build_site
      - name: Tests (new data moves the top 50's scores a little, so their reference is refreshed)
        run: |
          python -m pytest tests -q --deselect tests/test_golden.py::test_top_50_and_sentinels_unchanged
          UPDATE_GOLDEN=1 python -m pytest tests/test_golden.py -q
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/ site/ tests/fixtures/golden.csv
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "Monthly collectors: Hugging Face and Wikipedia ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
          gh workflow run pages.yml --ref main
      - name: Remind about hand-copied lists more than three months old (opens or updates an issue)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/stale_lists.py --issue
