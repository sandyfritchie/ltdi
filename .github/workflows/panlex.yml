# PanLex's lexical translations (ltdi/collectors/panlex.py): about 4 GB from the Hugging Face copy of
# PanLex's last database dump, counted per language. PanLex no longer updates, so this is run by hand
# (Actions -> PanLex -> Run workflow); it commits data/records/panlex.csv.
name: PanLex

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Corpus Crawler's word lists are where the records point
        run: curl -sSf -o /dev/null -w "%{http_code} %{size_download} bytes\n" https://www.gstatic.com/i18n/corpora/wordcounts/ace.txt
        continue-on-error: true
      - name: Count
        run: python -m ltdi.collectors panlex
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/records/panlex.csv data/sources_manifest.csv
          git diff --cached --quiet && exit 0
          git commit -m "PanLex: expressions per language from run ${{ github.run_id }}"
          git pull --rebase
          git push
