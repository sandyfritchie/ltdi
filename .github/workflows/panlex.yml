# Probe: what PanLex's database download looks like (temporary; replaced by the collector's workflow)
name: PanLex

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Hosts
        run: |
          for u in https://panlex.org/ https://www.panlex.org/ https://api.panlex.org/v2/langvar https://dev.panlex.org/ https://old.panlex.org/ https://vocab.panlex.org/ https://panlex.org/snapshot/ https://sourceforge.net/projects/panlex/files/; do
            echo "$u -> $(curl -sS -o /dev/null -m 30 -w '%{http_code} %{redirect_url}' -A 'ltdi-collector/0.1 (+https://github.com/sandyfritchie/ltdi)' "$u" 2>&1)"
          done
          curl -sS -m 30 -A 'ltdi-collector/0.1' https://panlex.org/snapshot/ | grep -oE 'href="[^"]+"' | sort -u | head -60
