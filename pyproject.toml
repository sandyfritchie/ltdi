[project]
name = "ltdi"
version = "0.1.0"
description = "Language Technology Development Index"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["ltdi", "ltdi.collectors"]

[project.optional-dependencies]
# Only the pipeline steps that need them: areas (shapely) and qq (qwanqwa)
build = ["shapely", "qwanqwa"]
# The font check (ltdi/collectors/fonts.py)
fonts = ["hyperglot"]
