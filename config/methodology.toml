# LTDI methodology config.
# The weights, goalposts and thresholds here are working choices, open to discussion; README.md explains them.

[meta]
edition = "2026-11"
# Lowest value a dimension index can take, so one empty dimension doesn't zero the LTDI
floor = 0.05

# ---------------------------------------------------------------- writing ---
[dimensions.writing]
label = "Writing system readiness"

[dimensions.writing.indicators.script_encoded]
label = "Main script encoded in Unicode"
scale = "bool"
weight = 0.5

# Font support (ltdi/collectors/fonts.py, data/records/fonts.csv) is checked but
# not scored: Google's Noto fonts display every language with a documented
# character set except a handful, and those failures are mostly quirks in the
# reference data, so it would add no information to the index.
[dimensions.writing.indicators.cldr_coverage]
label = "CLDR locale data coverage"
scale = "linear"
min = 0
max = 3
weight = 0.5

# ------------------------------------------------------------------- data ---
# Collectors record a value (zero where they find nothing) for every language, so an
# indicator is missing only before its collector has first run. A missing indicator
# is then left out, the remaining weights rescaled, and the language flagged.
[dimensions.data]
label = "Data availability"

# Text
# Web text that is mostly from Bible-related sites is narrow: the indicator is
# scaled by 1 - 0.5 x FineWeb-2's share of the language's documents from those
# sites, so text that is all Bible counts at half.
[dimensions.data.indicators.web_text_words]
label = "Web text (FineWeb-2 words)"
scale = "log"
min = 1e4
max = 1e11
weight = 0.25
narrowed_by = "web_text_bible_share"
narrow_floor = 0.5

# Web-mined OPUS corpora (CCAligned, CCMatrix, NLLB, WikiMatrix...) count at the share
# of distinct lines in a 2,000-line random sample that GlotLID identifies as the
# language (repeated lines count once)
# (data/opus_lid.csv); corpora over 20M pairs aren't checked and count in full.
[dimensions.data.indicators.parallel_sentences]
label = "Parallel text with English (OPUS sentence pairs)"
scale = "log"
min = 1e4
max = 1e9
weight = 0.15

[dimensions.data.indicators.ud_treebank_words]
label = "Annotated text (Universal Dependencies words)"
scale = "log"
min = 0
max = 1e6
weight = 0.05

# Bot-generated editions (Cebuano, Waray, Egyptian Arabic, Chechen, Tatar...) have
# thousands of articles per active editor: articles count up to 1,000 per active
# editor, and at least 10,000 (ltdi/collectors/wikipedia.py).
[dimensions.data.indicators.wikipedia_articles]
label = "Wikipedia articles"
scale = "log"
min = 100
max = 1e6
weight = 0.075

[dimensions.data.indicators.wikipedia_active_editors]
label = "Wikipedia active editors"
scale = "log"
min = 0
max = 1e5
weight = 0.075

# Speech: hours summed across open datasets (Common Voice, FLEURS, YODAS, WAXAL,
# Shrutilipi, Kathbath, IndicVoices, Vaani, NaijaVoices, Multilingual LibriSpeech)
[dimensions.data.indicators.open_speech_hours]
label = "Open transcribed speech (hours, all datasets)"
scale = "log"
min = 0
max = 10000
weight = 0.2

# Everything else
# Datasets tagged with many languages (Bible corpora, crawls, machine-translated sets
# and their re-uploads) count 20 / (languages tagged) for each language when they tag
# more than 20, so mass tagging doesn't make up most of a small language's count.
[dimensions.data.indicators.hf_datasets]
label = "Datasets on the Hugging Face Hub"
scale = "log"
min = 0
max = 10000
weight = 0.1

[dimensions.data.indicators.eval_benchmarks]
label = "Public benchmarks covering the language"
scale = "linear"
min = 0
max = 6
weight = 0.1

# ------------------------------------------------------------- technology ---
# Each technology starts from a presence score:
#   0.25 for being offered by any of the services checked, plus
#   0.75 x the share of commercial services that offer it
#   (so one of four services scores 0.44, all four score 1.0);
#   0.25 for an open model alone; 0 for nothing found.
# Counting by share keeps the score meaningful as more services are added.
# A technology with no commercial sources (language identification) counts its
# open tools by share instead.
# Depth indicators named after a service (tts_google_voice_types belongs to
# tts_google) weight that service's share: it earns half for offering the
# language and half for the depth it offers, so adding a service never lowers
# a score. (score.py can also average a depth indicator describing a technology as a
# whole with the presence score, but none is configured: every depth indicator
# belongs to a service.)
# Quality: where a service's quality for the language has been published
# (services.csv: quality, with a poor and a good mark), it counts in full at or
# above the good mark, down to half at or below the poor mark. Unmeasured
# services count in full, so being measured never helps a language's rivals.
# Now: Google Translate (FLORES-200 chrF++, Robinson et al. 2023), NLLB-200
# (Meta's FLORES-200 chrF++ for the Dense 3.3B model) and Whisper
# (FLEURS word error rate, which also counts a listed language missing from
# Whisper's published breakdown as poor).
# Omnilingual ASR (Meta, 2025) by its published character error rate: 25% or
# worse counts it at half, 5% or better in full.
# Regional providers (services.csv role "regional": Yandex, Baidu, Alibaba
# Cloud, Naver, Sarvam AI, Lelapa AI, GhanaNLP, Sunbird AI) count together as
# one extra commercial service, only for the languages one of them offers, at
# the best credit among them; so they raise a score or close a gap but never
# dilute the share for languages they don't serve.
# LLMs also use measured benchmark results (see [llm]).
[dimensions.tech]
label = "Technology support"
# Which services count for each technology, and their depth indicators, are in
# config/services.csv: one row per service.

[dimensions.tech.technologies.keyboard]
label = "Keyboard"
weight = 1

[dimensions.tech.technologies.speech_input]
label = "Speech input"
weight = 1

[dimensions.tech.technologies.tts]
label = "Text-to-speech"
weight = 1

[dimensions.tech.technologies.mt]
label = "Machine translation"
weight = 1

[dimensions.tech.technologies.llm]
label = "LLMs"
# Mean of two parts: availability in assistant apps (presence score over the
# apps), and quality: the measured benchmarks available for the language,
# each scaled linearly between its min and max.
weight = 1

[dimensions.tech.technologies.assistant]
label = "Voice assistant"
weight = 1

[dimensions.tech.technologies.interface]
label = "Interface language"
group = "more"  # shown under "More technologies" on the site
weight = 1

[dimensions.tech.technologies.ocr]
label = "Text recognition (OCR)"
group = "more"  # shown under "More technologies" on the site
weight = 1

[dimensions.tech.technologies.proofing]
label = "Spelling and grammar"
group = "more"  # shown under "More technologies" on the site
weight = 1

[dimensions.tech.technologies.langid]
label = "Language identification"
short = "Lang ID"  # where space is tight (chart labels)
group = "more"  # shown under "More technologies" on the site
# Mostly invisible to users, but every web-scale data pipeline starts with it.
weight = 0.5

# ------------------------------------------------------- written standard ---
# Spoken varieties whose speakers read and write a standard language
# (config/written_standards.csv: Egyptian Arabic -> Arabic, Wu -> Mandarin, ...)
# take the standard's value for written-language indicators where it is
# higher. Speech, speech data, benchmarks and language identification stay
# the variety's own.
[written_standard]
data = ["web_text_words", "parallel_sentences", "ud_treebank_words", "wikipedia_articles", "wikipedia_active_editors"]
technologies = ["keyboard", "mt", "llm", "interface", "ocr", "proofing"]
