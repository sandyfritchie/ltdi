# LTDI methodology config, slice edition.
# Every number here is a draft for discussion; see the project plan doc.

[meta]
edition = "2026-11"
# Lowest value a dimension index can take, so one empty dimension doesn't zero the LTDI
floor = 0.05

# ---------------------------------------------------------------- writing ---
[dimensions.writing]
label = "Writing system readiness"

[dimensions.writing.indicators.script_encoded]
label = "Main script encoded in Unicode"
scale = "bool"
weight = 0.5

[dimensions.writing.indicators.cldr_coverage]
label = "CLDR locale data coverage"
scale = "linear"
min = 0
max = 3
weight = 0.5

# ------------------------------------------------------------------- data ---
# Missing indicators (e.g. Wikipedia before its collector has run) are left
# out and the remaining weights rescaled; the language is flagged.
[dimensions.data]
label = "Data availability"

# Text
[dimensions.data.indicators.web_text_words]
label = "Web text (FineWeb-2 words)"
scale = "log"
min = 1e4
max = 1e11
weight = 0.25

[dimensions.data.indicators.parallel_sentences]
label = "Parallel text with English (OPUS sentence pairs)"
scale = "log"
min = 1e4
max = 1e9
weight = 0.15

[dimensions.data.indicators.ud_treebank_words]
label = "Annotated text (Universal Dependencies words)"
scale = "log"
min = 0
max = 1e6
weight = 0.05

[dimensions.data.indicators.wikipedia_articles]
label = "Wikipedia articles"
scale = "log"
min = 100
max = 1e6
weight = 0.075

[dimensions.data.indicators.wikipedia_active_editors]
label = "Wikipedia active editors"
scale = "log"
min = 0
max = 1e5
weight = 0.075

# Speech: hours summed across open datasets (Common Voice, FLEURS, YODAS, WAXAL,
# Shrutilipi, Kathbath, IndicVoices, Vaani, NaijaVoices, Multilingual LibriSpeech)
[dimensions.data.indicators.open_speech_hours]
label = "Open transcribed speech (hours, all datasets)"
scale = "log"
min = 0
max = 10000
weight = 0.2

# Everything else
[dimensions.data.indicators.hf_datasets]
label = "Datasets on the Hugging Face Hub"
scale = "log"
min = 0
max = 10000
weight = 0.1

[dimensions.data.indicators.eval_benchmarks]
label = "Public benchmarks covering the language"
scale = "linear"
min = 0
max = 6
weight = 0.1

# ------------------------------------------------------------- technology ---
# Each technology starts from a presence score:
#   0.25 for being offered by any of the services checked, plus
#   0.75 x the share of commercial services that offer it
#   (so one of four services scores 0.44, all four score 1.0);
#   0.25 for an open model alone; 0 for nothing found.
# Counting by share keeps the score meaningful as more services are added.
# A technology with no commercial sources (language identification) counts its
# open tools by share instead.
# Depth indicators named after a service (tts_google_voice_types belongs to
# tts_google) weight that service's share: it earns half for offering the
# language and half for the depth it offers, so adding a service never lowers
# a score. Depth that describes the technology as a whole (a published error
# rate) is averaged with the presence score.
# LLMs also use measured benchmark results (see [llm]).
[dimensions.tech]
label = "Technology support"
# Which services count for each technology, and their depth indicators, are in
# config/services.csv: one row per service.

[dimensions.tech.technologies.keyboard]
label = "Keyboard"
weight = 1

[dimensions.tech.technologies.speech_input]
label = "Speech input"
weight = 1

[dimensions.tech.technologies.tts]
label = "Text-to-speech"
weight = 1

[dimensions.tech.technologies.mt]
label = "Machine translation"
weight = 1

[dimensions.tech.technologies.llm]
label = "LLMs"
# Mean of two parts: availability in assistant apps (presence score over the
# apps), and quality: the measured benchmarks available for the language,
# each scaled linearly between its min and max.
weight = 1

[dimensions.tech.technologies.interface]
label = "Interface language"
group = "more"  # shown under "More technologies" on the site
weight = 1

[dimensions.tech.technologies.ocr]
label = "Text recognition (OCR)"
group = "more"  # shown under "More technologies" on the site
weight = 1

[dimensions.tech.technologies.proofing]
label = "Spelling and grammar"
group = "more"  # shown under "More technologies" on the site
weight = 1

[dimensions.tech.technologies.assistant]
label = "Voice assistant"
group = "more"  # shown under "More technologies" on the site
gap = true      # but still shown in the ranking's Gaps column
weight = 1

[dimensions.tech.technologies.langid]
label = "Language identification"
group = "more"  # shown under "More technologies" on the site
# Mostly invisible to users, but every web-scale data pipeline starts with it.
weight = 0.5

# ------------------------------------------------------- written standard ---
# Spoken varieties whose speakers read and write a standard language
# (config/written_standards.csv: Egyptian Arabic -> Arabic, Wu -> Mandarin, ...)
# take the standard's value for written-language indicators where it is
# higher. Speech, speech data, benchmarks and language identification stay
# the variety's own.
[written_standard]
data = ["web_text_words", "parallel_sentences", "ud_treebank_words", "wikipedia_articles", "wikipedia_active_editors"]
technologies = ["keyboard", "mt", "llm", "interface", "ocr", "proofing"]
